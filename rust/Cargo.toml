[workspace]
resolver = "2"
members = ["crates/core", "crates/cleaner", "app", "dashboard"]

[workspace.package]
version = "2.3.0"
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Decided in PORT_PLAN: unwind, NOT abort (catch_unwind around poll ticks / wndproc / hook main).
panic = "unwind"
