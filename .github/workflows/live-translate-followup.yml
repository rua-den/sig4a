name: 'Live Translate Phase 1 - offline model diagnostics'
'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-translate-followup.yml'
      - 'tools/live_translate_bench/followup/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mt:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install pinned local CPU runtimes
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          python -m pip install --only-binary=:all: "transformers==4.51.3" "safetensors==0.5.3" "sentencepiece==0.2.0" "sacremoses==0.1.1"
      - name: Compare translators on clean and cached synthetic ASR text
        run: .\tools\live_translate_bench\followup\compare-hosted.ps1 -Evidence "$env:RUNNER_TEMP\sig4a-mt-diagnostic"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-window-mt-diagnostic
          path: ${{ runner.temp }}/sig4a-mt-diagnostic/
          if-no-files-found: warn
