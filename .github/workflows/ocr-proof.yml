name: Native OCR proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ocr-proof.yml', '.github/ocr-proof/**']
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'dot/ocr-native-proof'
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build exact dashboard
        working-directory: rust
        run: cargo build --locked -p claude-usage-dashboard
      - name: Capture, recognize, copy, and translate synthetic text
        run: ./.github/ocr-proof/proof.ps1
