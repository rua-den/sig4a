name: Windows experimental Live Translate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publisher_terms_confirmed:
        description: Optional HY-MT check only when the operator has verified this runner is in eligible territory and accepted the upstream terms
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 38
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Locked Windows workspace regression
        working-directory: rust
        run: |
          tzutil.exe /s "SE Asia Standard Time"
          cargo test --locked --workspace -- --test-threads=1
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 38
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the actual user ZIP
        run: .\build.ps1
      - name: Smoke-test ordinary extracted package
        run: |
          $files = @(Get-ChildItem dist -File -Filter 'sig4a-*-windows.zip')
          if ($files.Count -ne 1) { throw 'Expected one app ZIP.' }
          .\.github\live-translate\smoke-package.ps1 -Archive $files[0].FullName
          git rev-parse HEAD | Set-Content dist/REVISION.txt
          $hash = Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256
          "$($hash.Hash)  $($files[0].Name)" | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sig4a-experimental-windows
          path: dist/
          if-no-files-found: error
  windows-local-engine:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify consent refusal and actual local English engine
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'sig4a-native-engine/live-translate'
          .\tools\live_translate_runtime\Publish.ps1 -Output $stage
          & (Join-Path $stage 'Provision-Model.ps1')
          $refused = $false
          try { & (Join-Path $stage 'Provision-Translation.ps1') }
          catch { $refused = $_.Exception.Message -match 'AcceptPublisherTerms' }
          if (!$refused -or (Test-Path (Join-Path $stage 'models/hymt'))) { throw 'Expected consent refusal before downloading optional assets.' }
          .\tools\live_translate_runtime\Inference-Smoke.ps1 -Published $stage -Scratch (Join-Path $env:RUNNER_TEMP 'sig4a-synthetic-product-engine')
      - name: Verify optional real Vietnamese engine on a confirmed eligible runner
        if: github.event_name == 'workflow_dispatch' && inputs.publisher_terms_confirmed == true
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'sig4a-native-engine/live-translate'
          & (Join-Path $stage 'Provision-Translation.ps1') -AcceptPublisherTerms
          .\tools\live_translate_runtime\Inference-Smoke.ps1 -Published $stage -Scratch (Join-Path $env:RUNNER_TEMP 'sig4a-synthetic-product-engine-vi') -Vietnamese
