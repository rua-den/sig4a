name: Live Translate Phase 1 audio probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-translate-audio-proof.yml'
      - 'tools/live_translate_audio_probe/**'
permissions:
  contents: read
jobs:
  wasapi:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and exercise native WASAPI probe
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $d = './tools/live_translate_audio_probe'
          dotnet build "$d/AudioProbe.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'WASAPI probe build failed' }
          $app = Get-ChildItem "$d/bin/Release" -Recurse -Filter AudioProbe.dll | Select-Object -First 1 -ExpandProperty FullName
          if (!$app) { throw 'AudioProbe.dll not found' }
          $listRaw = dotnet $app --list
          if ($LASTEXITCODE -ne 0) { throw "Enumeration failed: $listRaw" }
          $list = ConvertFrom-Json $listRaw
          "Hosted enumeration succeeded; render=$(@($list.endpoints | Where-Object source -eq 'playback').Count); capture=$(@($list.endpoints | Where-Object source -eq 'mic').Count)"
          $bad = dotnet $app 1 playback '<invalid-proof-id>'
          if ($LASTEXITCODE -eq 0 -or (ConvertFrom-Json $bad).ok) { throw 'Invalid endpoint unexpectedly accepted' }
          $bad = dotnet $app 1 mic default
          if ($LASTEXITCODE -eq 0 -or (ConvertFrom-Json $bad).ok) { throw 'Unexpected microphone default fallback' }
          $render = @($list.endpoints | Where-Object source -eq 'playback')
          $mic = @($list.endpoints | Where-Object source -eq 'mic')
          if ($render.Count) {
            $bad = dotnet $app 1 mic $render[0].id
            if ($LASTEXITCODE -eq 0 -or (ConvertFrom-Json $bad).ok) { throw 'Mic accepted render endpoint ID' }
          }
          if ($mic.Count) {
            $bad = dotnet $app 1 playback $mic[0].id
            if ($LASTEXITCODE -eq 0 -or (ConvertFrom-Json $bad).ok) { throw 'Playback accepted mic endpoint ID' }
          }
          'AUDIO-PROOF: invalid IDs rejected; no source auto-fallback'
          if (!$render.Count) {
            'AUDIO-PROOF: playback unavailable: no active render endpoints; no runtime or physical pass'
            exit 0
          }
          $file = Join-Path $env:RUNNER_TEMP 'sig4a-probe-tone.wav'
          python -c "import math, struct, sys, wave; f=wave.open(sys.argv[1],'wb'); f.setparams((1,2,16000,0,'NONE','not compressed')); f.writeframes(b''.join(struct.pack('<h',int(4000*math.sin(2*math.pi*440*i/16000))) for i in range(16000))); f.close()" $file
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic playback fixture generation failed' }
          $player = [System.Media.SoundPlayer]::new($file)
          try {
            $player.PlayLooping()
            $capture = @(dotnet $app 3 playback default)
            if ($LASTEXITCODE -ne 0) { throw "Playback failed: $capture" }
            $rows = @($capture | ForEach-Object { ConvertFrom-Json $_ })
            if ($rows.Count -ne 3 -or $rows[0].stage -ne 'initial' -or $rows[1].stage -ne 'reopen' -or !$rows[2].all_streams_disposed -or $rows[0].endpoint_id -ne $rows[1].endpoint_id -or $rows[0].disposed_ms -gt $rows[1].started_ms) { throw "Lifecycle order wrong: $capture" }
            if (!$rows[0].signal_observed -or !$rows[1].signal_observed) { throw "Synthetic signal not observed: $capture" }
            'AUDIO-PROOF: hosted playback signal, Stop/dispose and reopen verified; no physical pass'
          } finally {
            $player.Stop()
            $player.Dispose()
            Remove-Item -LiteralPath $file -Force
          }
