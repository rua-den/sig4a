name: Live Translate Phase 1 synthetic Windows proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-translate-proof.yml'
      - 'tools/live_translate_bench/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-2025
    timeout-minutes: 38
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install pinned CPU dependencies
        run: python -m pip install --only-binary=:all: "numpy==2.2.6" "sherpa-onnx==1.12.30" "sherpa-onnx-core==1.12.30" "psutil==7.0.0"
      - name: Replay frozen synthetic fixtures through the two real local model chains
        run: .\tools\live_translate_bench\run-hosted.ps1 -Evidence "$env:RUNNER_TEMP\sig4a-live-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-windows-live-translate
          path: ${{ runner.temp }}/sig4a-live-evidence/
          if-no-files-found: warn
